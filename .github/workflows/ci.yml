# Checks every pull request and push to main. Every push to main that passes the checks is
# released as the next patch version (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main are not, so a release is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run prettier:check
      - run: npm run spellcheck
      - run: npm run test:ci
      - run: npm run build

      - name: Package
        if: github.event_name == 'pull_request'
        run: ./scripts/package.sh artifacts

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: aissentials-clickhousedrilldown-app-pr-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
