# Builds and publishes a release: the archive (signed when the GRAFANA_ACCESS_POLICY_TOKEN secret is
# set), its checksums and build provenance, as the latest GitHub release.
#
# - Every push to main releases the next patch version (called from ci.yml after the checks).
# - Run it from the Actions tab with a version, e.g. 0.2.0, for a minor or major version.
# - Pushing a tag vX.Y.Z releases that tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (creates the tag v0.2.0). Empty for the next patch version.
        required: false
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # One release at a time, so two pushes never get the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Determine the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          releases=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          latest=$(head -1 <<< "$releases")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            create_tag=false
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            create_tag=true
          elif [ -n "$latest" ]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
            create_tag=true
          else
            version=$(node -p "require('./package.json').version")
            create_tag=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'."; exit 1
          fi
          if [ "$create_tag" = true ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."; exit 1
          fi
          # The highest release below this version, for the release notes.
          previous=""
          for tag in $releases; do
            if [ "${tag#v}" != "$version" ] && [ "$(printf '%s\n%s\n' "${tag#v}" "$version" | sort -V | head -1)" = "${tag#v}" ]; then
              previous=$tag; break
            fi
          done
          npm version "$version" --no-git-tag-version --allow-same-version
          {
            echo "version=$version"
            echo "create_tag=$create_tag"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous release: ${previous:-none})"

      - run: npm run build

      - name: Sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            npm run sign
          else
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not set, the release is not signed."
          fi

      - name: Package
        id: package
        run: ./scripts/package.sh artifacts >> "$GITHUB_OUTPUT"

      # Build provenance, which Grafana's plugin submission asks for. GitHub offers attestations
      # for public repositories (private ones need GitHub Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          # The version's CHANGELOG.md section, if there is one, then the commits since the previous release.
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; found = ($2 == v || $2 == "v" v); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -n "$PREVIOUS" ]; then
            {
              echo
              echo "### Changes since $PREVIOUS"
              echo
              git log --no-merges --pretty='- %s (%h)' "$PREVIOUS..HEAD"
              echo
              echo "**Full changelog:** $COMPARE_URL/$PREVIOUS...v$VERSION"
            } >> notes.md
          fi
          if [ ! -s notes.md ]; then echo "Version $VERSION." > notes.md; fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          CREATE_TAG: ${{ steps.version.outputs.create_tag }}
        run: |
          if [ "$CREATE_TAG" = true ]; then
            tag_args=(--target "$GITHUB_SHA")
          else
            tag_args=(--verify-tag)
          fi
          gh release create "v$VERSION" artifacts/* \
            "${tag_args[@]}" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
          # Earlier versions of this pipeline kept a rolling "preview" pre-release; it is no longer used.
          gh release delete preview --cleanup-tag --yes 2>/dev/null || true
