# Releases an official version when a tag vX.Y.Z is pushed: the version comes from the tag, the
# archive is signed when the GRAFANA_ACCESS_POLICY_TOKEN secret is set, and a GitHub release is
# created with the archive, its checksums and the tag's CHANGELOG.md section as notes.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Or run it from the Actions tab (Run workflow) with a version: it releases the selected branch's
# latest commit and creates the tag vX.Y.Z there.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3 (creates the tag v1.2.3)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci

      - name: Set version from the tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.2.3, got '$INPUT_VERSION'."; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists."; exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            npm run sign
          else
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not set, the release is not signed."
          fi

      - name: Package
        id: package
        run: ./scripts/package.sh artifacts >> "$GITHUB_OUTPUT"

      # Build provenance, which Grafana's plugin submission asks for. GitHub offers attestations
      # for public repositories (private ones need GitHub Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; found = ($2 == v || $2 == "v" v) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version $VERSION." > notes.md; fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A manual run creates the tag on the released commit; a tag push already has it.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag_args=(--target "$GITHUB_SHA")
          else
            tag_args=(--verify-tag)
          fi
          # GitHub's generated notes (pull requests and a compare link) start at the previous
          # release; without one, only the changelog section is used. The preview tag is skipped.
          previous=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | sort -V \
            | awk -v v="v$VERSION" '{ split($0, a, /[v.]/); split(v, b, /[v.]/);
                if (a[2] < b[2] || (a[2] == b[2] && (a[3] < b[3] || (a[3] == b[3] && a[4] < b[4])))) last = $0 }
                END { print last }') || true
          notes_args=()
          if [ -n "$previous" ]; then notes_args=(--generate-notes --notes-start-tag "$previous"); fi
          gh release create "v$VERSION" artifacts/* \
            "${tag_args[@]}" \
            "${notes_args[@]}" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
